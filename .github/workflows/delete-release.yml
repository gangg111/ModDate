name: Delete release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag wydania do usunięcia (np. v1.0.0)'
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ inputs.tag }}" --repo "${{ github.repository }}" --cleanup-tag --yes
