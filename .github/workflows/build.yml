name: Build ModDate.exe
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag wydania (np. v1.0.0) – pusty = tylko build'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build (MSVC)
        shell: cmd
        run: |
          mkdir build
          rc /nologo /fo build\app.res src\app.rc
          cl /nologo /utf-8 /std:c++17 /O2 /EHsc /MT /DUNICODE /D_UNICODE src\main.cpp build\app.res /Fo:build\ /Fe:build\ModDate.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib comctl32.lib comdlg32.lib shell32.lib gdiplus.lib ole32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: ModDate
          path: build/ModDate.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ModDate ${{ inputs.release_tag || github.ref_name }}
          files: build/ModDate.exe
          body: |
            **ModDate** to aplikacja dla Windows do zmiany daty i godziny modyfikacji plików.

            Pobierz **ModDate.exe** i uruchom. Nie wymaga instalacji ani dodatkowych bibliotek (Windows 7 lub nowszy, 64-bit).

            - wybór pliku ikoną folderu lub przez przeciągnięcie
            - podgląd daty modyfikacji, utworzenia i ostatniego dostępu
            - pole daty i godziny z polskim kalendarzem oraz przyciski „Aktualny” i „Aktualizuj”
            - ciemny motyw w stylu Windows 11
