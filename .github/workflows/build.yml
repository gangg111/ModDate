name: Build ModDate.exe
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build (MSVC)
        shell: cmd
        run: |
          mkdir build
          rc /nologo /fo build\app.res src\app.rc
          cl /nologo /std:c++17 /O2 /EHsc /MT /DUNICODE /D_UNICODE src\main.cpp build\app.res /Fo:build\ /Fe:build\ModDate.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib comctl32.lib comdlg32.lib shell32.lib gdiplus.lib ole32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: ModDate
          path: build/ModDate.exe
